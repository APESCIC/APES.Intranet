# Reference copy of the virtual host Laragon writes for this project.
# Laragon generates it as
#   C:\laragon\etc\apache2\sites-enabled\auto.apes-intranet.test.conf
# when C:\laragon\www\apes-intranet exists and you click Reload.
# You do not need to copy this file. Only if Laragon's file goes missing or
# breaks, copy this one to C:\laragon\etc\apache2\sites-enabled\apes-intranet.test.conf
# (without the "auto." prefix, so Laragon leaves it alone), then Reload.

define ROOT "C:/laragon/www/apes-intranet/public"
define SITE "apes-intranet.test"

<VirtualHost *:80>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot "${ROOT}"
    ServerName ${SITE}
    ServerAlias *.${SITE}
    <Directory "${ROOT}">
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile      C:/laragon/etc/ssl/laragon.crt
    SSLCertificateKeyFile   C:/laragon/etc/ssl/laragon.key
</VirtualHost>
