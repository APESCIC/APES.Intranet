# Updates go to the long-lived `dependencies` branch, never straight to `main`.
# Each version branch merges `origin/dependencies` when work on it starts, so
# updates ship inside the version's single merge. Security updates ignore
# target-branch and open against `main`: retarget them to `dependencies`. See
# "Dependency updates" in docs/decisions.md.
version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    target-branch: dependencies
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/"
    target-branch: dependencies
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dependencies
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
