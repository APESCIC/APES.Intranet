name: Run continuous integration checks

# Markdown, workflows, Pint, Larastan, the Vite build, release notes and PHPUnit.
# Accessibility is checked locally on Laravel Herd (Cursor browser), not via Playwright in CI.
# Runs on PRs into main, version branches and dependencies, and on main and vX.Y.Z tags. It never releases or deploys.

on:
  pull_request:
    branches:
      - main
      - 'milestone/**'
      - dependencies
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, zip

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: apes_intranet_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: apes_intranet_testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint.yaml
          globs: |
            **/*.md
            !vendor/**
            !node_modules/**

      - name: Install actionlint
        shell: bash
        run: |
          set -eu
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 15 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Check workflow files
        shell: bash
        run: actionlint -color

      - name: Parse YAML files
        shell: bash
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib
          import sys
          import yaml

          errors = 0
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix not in {".yml", ".yaml"}:
                  continue
              if {".git", "vendor", "node_modules"} & set(path.parts):
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except yaml.YAMLError as exc:
                  print(f"{path}: {exc}")
                  errors += 1
          if errors:
              sys.exit(1)
          PY

      - name: Reject unexpected env files
        shell: bash
        run: |
          set -eu
          found=0
          while IFS= read -r -d '' path; do
            base="${path##*/}"
            case "${base}" in
              .env.example|.env.herd.example)
                ;;
              .env|.env.*)
                printf 'Unexpected env file committed: %s\n' "${path}"
                found=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "${found}" -ne 0 ]; then
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Find the Composer cache folder
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.herd.example .env
          php artisan key:generate

      - name: Check release notes
        run: php artisan changelog:validate

      - name: Check the tag has a published release note
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: php artisan changelog:validate --require-published="$TAG"

      - name: Run PHPUnit tests
        run: php artisan test --compact

      - name: Note accessibility is checked on Herd locally
        run: echo "Accessibility is verified on https://apes-intranet.test with Cursor's built-in browser (not Playwright in CI)."

  # Cloudron runs PHP 8.4. Not a required check, so the required ci job keeps its name.
  tests-php84:
    name: PHPUnit on PHP 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: apes_intranet_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: apes_intranet_testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Find the Composer cache folder
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.herd.example .env
          php artisan key:generate

      - name: Tests on PHP 8.4
        run: php artisan test --compact
