on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.3'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, pdo_mysql, zip

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: apes_intranet_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: apes_intranet_testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure markdownlint
        shell: bash
        run: |
          printf '%s\n' 'MD013: false' 'MD034: false' > .markdownlint.yaml

      - name: Check Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint.yaml
          globs: |
            **/*.md
            !vendor/**
            !node_modules/**

      - name: Install actionlint
        shell: bash
        run: |
          set -eu
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 15 -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Check workflow files
        shell: bash
        run: actionlint -color

      - name: Parse YAML files
        shell: bash
        run: |
          set -eu
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib
          import sys
          import yaml

          errors = 0
          for path in pathlib.Path(".").rglob("*"):
              if path.suffix not in {".yml", ".yaml"}:
                  continue
              if {".git", "vendor", "node_modules"} & set(path.parts):
                  continue
              try:
                  list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
              except yaml.YAMLError as exc:
                  print(f"{path}: {exc}")
                  errors += 1
          if errors:
              sys.exit(1)
          PY

      - name: Reject unexpected env files
        shell: bash
        run: |
          set -eu
          found=0
          while IFS= read -r -d '' path; do
            base="${path##*/}"
            case "${base}" in
              .env.example|.env.laragon.example)
                ;;
              .env|.env.*)
                printf 'Unexpected env file committed: %s\n' "${path}"
                found=1
                ;;
            esac
          done < <(git ls-files -z)
          if [ "${found}" -ne 0 ]; then
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress --error-format=github

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Prepare environment
        run: |
          cp .env.laragon.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test --compact

      - name: Start app for the accessibility check
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's/^DB_DATABASE=.*/DB_DATABASE=apes_intranet_testing/' \
            -e 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' \
            -e 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' \
            -e 's/^CACHE_STORE=.*/CACHE_STORE=file/' \
            -e 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' \
            -e 's|^APP_URL=.*|APP_URL=http://127.0.0.1:8000|' \
            .env
          php artisan migrate:fresh --seed --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/login && exit 0
            sleep 1
          done
          cat /tmp/serve.log
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility check (axe and keyboard)
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npm run test:a11y
