name: Bug report
description: Something in APES Intranet doesn't work as it should
title: "[Bug] "
labels:
  - bug
assignees:
  - apescic-director
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you. No passwords, personal data or real HR, student, volunteer
        or agreement details, including in screenshots. A security problem
        goes to SECURITY.md and a private advisory, not here.
        After opening, set the version milestone. The area label is added for you.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The matching area label is added when the issue opens.
      options:
        - "area:cloudron"
        - "area:local-dev"
        - "area:auth"
        - "area:people"
        - "area:comms"
        - "area:operations"
        - "area:helpdesk"
        - "area:hr"
        - "area:agreements"
        - "area:integrations"
        - "area:accessibility"
        - "area:tests"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen, and what happens instead
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where
      description: Version (the pill in the footer), browser or device.
      placeholder: v0.5.0, Edge on Windows 11
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove anything personal first.

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed passwords, personal data and real HR, student, volunteer or agreement details.
          required: true
        - label: This is not a security problem.
          required: true
