name: Chore
description: Maintenance or set-up work that people won't notice directly
title: "[Chore] "
labels:
  - chore
assignees:
  - apescic-director
type: Task
body:
  - type: markdown
    attributes:
      value: |
        Say what needs doing and why. No passwords, personal data or real HR,
        student, volunteer or agreement details.
        After opening, set the version milestone. The area label is added for you.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The matching area label is added when the issue opens.
      options:
        - "area:cloudron"
        - "area:local-dev"
        - "area:auth"
        - "area:people"
        - "area:comms"
        - "area:operations"
        - "area:helpdesk"
        - "area:hr"
        - "area:agreements"
        - "area:integrations"
        - "area:accessibility"
        - "area:tests"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What and why
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Things anyone can check to know it's finished, one per line.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed passwords, personal data and real HR, student, volunteer or agreement details.
          required: true
