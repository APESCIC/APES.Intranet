name: Epic
description: The parent issue for one version milestone
title: "[Epic] "
labels:
  - epic
assignees:
  - apescic-director
body:
  - type: markdown
    attributes:
      value: |
        One Epic per milestone, titled `[Epic] <milestone title>`, for example
        `[Epic] v0.6.0 HR and training`. The ship-gate answer, the release
        summary and the deploy evidence are posted here. Link each child as a
        sub-issue. After opening, set the milestone. The area label is added for you.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The matching area label is added when the issue opens.
      options:
        - "area:cloudron"
        - "area:local-dev"
        - "area:auth"
        - "area:people"
        - "area:comms"
        - "area:operations"
        - "area:helpdesk"
        - "area:hr"
        - "area:agreements"
        - "area:integrations"
        - "area:accessibility"
        - "area:tests"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this version delivers when every sub-issue is done.
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: Sub-issues
      description: One line per child issue. Tick each one when it closes.
      placeholder: |
        - [ ] #123 [Story] Short title
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed passwords, personal data and real HR, student, volunteer or agreement details.
          required: true
