name: Story
description: Ask for something new or better in APES Intranet (a user-facing story)
title: "[Story] "
labels:
  - story
assignees:
  - apescic-director
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Say what people need and what they should be able to do. No passwords,
        personal data or real HR, student, volunteer or agreement details.
        After opening, set the version milestone. The area label is added for you.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: The matching area label is added when the issue opens.
      options:
        - "area:cloudron"
        - "area:local-dev"
        - "area:auth"
        - "area:people"
        - "area:comms"
        - "area:operations"
        - "area:helpdesk"
        - "area:hr"
        - "area:agreements"
        - "area:integrations"
        - "area:accessibility"
        - "area:tests"
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: What do people need?
      description: The problem to solve, and who has it.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      description: Things anyone can check to know it's finished, one per line.
      placeholder: |
        - Staff can ...
        - The page shows ...
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Not included
      description: Anything left out on purpose.

  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: I removed passwords, personal data and real HR, student, volunteer or agreement details.
          required: true
