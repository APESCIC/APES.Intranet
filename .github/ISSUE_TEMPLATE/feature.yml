name: Feature
description: Propose an improvement to APES Intranet
title: "[Story] "
labels:
  - enhancement
assignees:
  - apescic-director
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Describe the need and the outcome you want. Remove credentials,
        personal data, and real HR, student, volunteer or agreement details.
        After opening, set the area label and the milestone to match the
        answers below. The form does not apply them itself.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Matches an area label. Set that label after opening.
      options:
        - "area:cloudron"
        - "area:local-dev"
        - "area:auth"
        - "area:people"
        - "area:comms"
        - "area:operations"
        - "area:helpdesk"
        - "area:hr"
        - "area:agreements"
        - "area:integrations"
        - "area:accessibility"
        - "area:tests"
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      description: Work one milestone at a time, in order. Set it after opening.
      options:
        - "v0.1.x Foundations"
        - "v0.2.x People"
        - "v0.3.x Communications"
        - "v0.4.x Operations"
        - "v0.5.x Help desk"
        - "v0.6.x HR and training"
        - "v0.7.x Agreements and legal"
        - "v0.8.x Hiring and integrations"
        - "v1.0.0 Launch"
    validations:
      required: true

  - type: textarea
    id: need
    attributes:
      label: Underlying need
      description: What user or operational problem should be solved?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should people be able to do when this is done?
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Describe a preferred solution if you have one.

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is left out?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that would make this complete.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Data-safety confirmation
      options:
        - label: >-
            I removed credentials, personal data, and real HR, student,
            volunteer or agreement details.
          required: true
