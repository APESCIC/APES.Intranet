# Local development: http://intranet.apes.test:8080 (see docs/local-development.md).
# Fake data only. Cloudron does not use this file.
name: apes-intranet

services:
  app:
    build: docker/php
    volumes:
      - .:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: caddy:2-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/app/public:ro
    depends_on:
      - app

  node:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      VITE_DEV_HOST: intranet.apes.test
      # 5174, so it does not clash with other projects' Vite on 5173.
      VITE_PORT: "5174"
    extra_hosts:
      # Lets the accessibility check reach the preview and Vite from inside.
      - "intranet.apes.test:host-gateway"
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      # Linux packages, kept apart from any Windows node_modules on the host.
      - node_modules:/app/node_modules

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: apes_intranet
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit
    ports:
      # 8026 on the host, so it does not clash with Laragon's Mailpit on 8025.
      - "8026:8025"

volumes:
  mysql-data:
  node_modules:
