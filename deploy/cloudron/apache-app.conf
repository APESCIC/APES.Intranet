# Apache site for a release-based Laravel app on the Cloudron LAMP app.
# Install as /app/data/apache/app.conf and restart the app.

ServerName localhost

<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off
    DocumentRoot /app/data/current/public

    LogFormat "%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" proxy
    CustomLog "|/bin/cat" proxy
    ErrorLog "|/bin/cat"

    <Directory /app/data/current/public>
        Options +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Required by Cloudron so the app sees the real client IP.
    Include "/app/code/apache/rpaf.conf"
</VirtualHost>
